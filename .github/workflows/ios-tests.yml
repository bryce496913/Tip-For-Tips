name: iOS Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: |
          test -d /Applications/Xcode_26.app || { echo "::error::The release Xcode 26 toolchain is not installed on this runner."; exit 1; }
          sudo xcode-select -s /Applications/Xcode_26.app
          xcodebuild -version
      - name: Resolve and boot simulator
        id: simulator
        run: |
          xcodebuild -project "Tips For Tips.xcodeproj" -scheme "Tips For Tips" -showdestinations
          xcrun simctl list devices available
          UDID=$(xcrun simctl list devices available --json | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; phones=[x for runtime in d.values() for x in runtime if x.get("isAvailable") and x["name"].startswith("iPhone")]; preferred=next((x for x in phones if x["name"]=="iPhone 16"), phones[0] if phones else None); print(preferred["udid"] if preferred else "")')
          test -n "$UDID" || { echo "::error::No supported iPhone simulator is installed."; exit 1; }
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$UDID" || true
          open -a Simulator
          xcrun simctl bootstatus "$UDID" -b
      - name: Run unit and UI tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project "Tips For Tips.xcodeproj" \
            -scheme "Tips For Tips" \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}" \
            -resultBundlePath TestResults.xcresult 2>&1 | tee xcodebuild-test.log
      - name: Upload failed test artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-results
          path: |
            TestResults.xcresult
            xcodebuild-test.log
