name: iOS Tests

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    name: Unit and UI tests
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Select Xcode 16.4
        run: |
          sudo xcode-select --switch /Applications/Xcode_16.4.app/Contents/Developer
          xcodebuild -version

      - name: Resolve an installed iPhone simulator
        id: simulator
        shell: bash
        run: |
          set -euo pipefail
          destination_id="$({ xcrun simctl list devices available --json; } | python3 -c '
          import json
          import sys

          devices = [
              device
              for runtime_devices in json.load(sys.stdin)["devices"].values()
              for device in runtime_devices
              if device.get("isAvailable", False) and device.get("name", "").startswith("iPhone")
          ]
          if not devices:
              raise SystemExit("No available iPhone simulator is installed")

          preferred_names = ("iPhone 16 Pro", "iPhone 16", "iPhone 15 Pro", "iPhone 15")
          selected = next((device for name in preferred_names for device in devices if device["name"] == name), devices[0])
          print(selected["udid"])
          ' )"
          simulator_name="$(xcrun simctl list devices available | awk -v id="$destination_id" '$0 ~ id { sub(/^[[:space:]]*/, ""); sub(/ \(.*/, ""); print; exit }')"
          echo "Resolved simulator: $simulator_name ($destination_id)"
          echo "id=$destination_id" >> "$GITHUB_OUTPUT"
          echo "name=$simulator_name" >> "$GITHUB_OUTPUT"

      - name: Run unit and UI tests
        shell: bash
        run: |
          set -o pipefail
          rm -rf TestResults.xcresult
          xcodebuild test \
            -project "Tips For Tips.xcodeproj" \
            -scheme "Tips For Tips" \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.id }}" \
            -resultBundlePath TestResults.xcresult \
            2>&1 | tee xcodebuild.log

      - name: Verify Release build
        run: |
          xcodebuild build \
            -project "Tips For Tips.xcodeproj" \
            -scheme "Tips For Tips" \
            -configuration Release \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.id }}" \
            CODE_SIGNING_ALLOWED=NO

      - name: Archive and verify iPhone-only device family
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build/TipsForTips.xcarchive
          xcodebuild archive \
            -project "Tips For Tips.xcodeproj" \
            -scheme "Tips For Tips" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/TipsForTips.xcarchive \
            CODE_SIGNING_ALLOWED=NO

          python3 - <<'PY'
          import plistlib
          from pathlib import Path

          info_plist = Path("build/TipsForTips.xcarchive/Products/Applications/Tips For Tips.app/Info.plist")
          with info_plist.open("rb") as plist_file:
              device_family = plistlib.load(plist_file).get("UIDeviceFamily")

          if device_family != [1]:
              raise SystemExit(f"Expected iPhone-only UIDeviceFamily [1], found {device_family!r}")
          print(f"Verified archive UIDeviceFamily: {device_family}")
          PY

      - name: Upload test diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-diagnostics
          if-no-files-found: warn
          retention-days: 14
          path: |
            TestResults.xcresult
            xcodebuild.log
            build/TipsForTips.xcarchive
